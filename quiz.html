<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRDO SAO - Quiz Practice</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f4f6f9; color: #222; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #0b3d91; color: #fff; padding: 20px; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,.2); }
        header h1 { font-size: 1.8rem; margin-bottom: 5px; }
        .container { width: 90%; max-width: 800px; margin: 30px auto; flex: 1; }
        .card { background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,.08); }
        .quiz-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .score-board { font-weight: 600; background: #eef3fc; color: #0b3d91; padding: 6px 14px; border-radius: 20px; }
        .question-text { font-size: 1.15rem; color: #333; margin-bottom: 20px; font-weight: 600; }
        
        /* Options Display Vertical (Ek ke niche ek) */
        .options-container { display: flex; flex-direction: column !important; gap: 12px; margin-bottom: 20px; }
        .option { 
            display: block; 
            width: 100%; 
            text-align: left; 
            padding: 14px 18px; 
            background: #f8f9fa; 
            border: 2px solid #cbd5e0; 
            border-radius: 8px; 
            font-size: 1rem; 
            cursor: pointer; 
            transition: all .2s; 
            color: #2d3748;
        }
        .option:hover:not(:disabled) { background: #edf2f7; border-color: #0b3d91; }
        .option:disabled { cursor: not-allowed; }
        
        .explanation-box { margin-top: 15px; padding: 14px 18px; background: #eef6ff; border-left: 4px solid #0b3d91; border-radius: 6px; font-size: 0.95rem; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 25px; }
        .btn { padding: 10px 22px; background: #0b3d91; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; }
        .btn:hover { background: #082b66; }
        
        /* Result Screen Styling */
        .result-box { text-align: center; display: none; }
        .result-box h2 { color: #0b3d91; font-size: 2rem; margin-bottom: 15px; }
        .result-stats { font-size: 1.3rem; margin: 20px 0; font-weight: 500; }
        .percentage { font-size: 2.5rem; font-weight: 700; color: #28a745; margin-bottom: 20px; }

        footer { margin-top: 40px; padding: 20px; background: #111; color: #fff; text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <h1>DRDO SAO Practice Quiz</h1>
        <a href="index.html" style="color: #fff; text-decoration: underline; font-size: 0.9rem;">← Back to Home</a>
    </header>
    <div class="container">
        <!-- Quiz Box -->
        <div id="quizBox" class="card">
            <div class="quiz-header">
                <h2>Question <span id="questionNo">1</span> / <span id="total">0</span></h2>
                <div class="score-board">Score: <span id="score">0</span></div>
            </div>
            <h3 id="question" class="question-text">Loading question...</h3>
            <div id="options" class="options-container"></div>
            <div id="explanation" class="explanation-box" style="display:none;"></div>
            <div class="nav-buttons">
                <button class="btn" onclick="prevQuestion()">Previous</button>
                <button class="btn" onclick="nextQuestion()">Next</button>
            </div>
        </div>

        <!-- Final Result Screen -->
        <div id="resultBox" class="card result-box">
            <h2>🎉 Quiz Completed!</h2>
            <div class="result-stats">
                You scored <span id="finalScore" style="color:#0b3d91; font-weight:700;">0</span> out of <span id="finalTotal">0</span>
            </div>
            <div id="finalPercent" class="percentage">0%</div>
            <button class="btn" onclick="location.reload()">Restart Quiz</button>
            <a href="index.html" class="btn" style="margin-left: 10px; background: #6c757d;">Home Page</a>
        </div>
    </div>
    <footer>
        <p>© DRDO SAO MCQ Practice</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
